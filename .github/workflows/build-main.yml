name: Build Main Firmware

on:
  push:
  pull_request:

jobs:
  build-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build main firmware
        run: pio run -e esp-wrover-kit
